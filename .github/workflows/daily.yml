# Daily conditions update: 04:00 UTC = 06:00 Cyprus winter time (07:00 in summer).
# Fetch weather -> score today + 7 days -> export PUBLIC data -> deploy to GitHub Pages.
# If the weather source is down, the run fails before deploying, so the site keeps
# yesterday's data and shows "Data delayed" by itself.
name: Daily conditions update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full 31-day weather fetch"
        type: boolean
        default: false

permissions:
  contents: write          # push the built site to the gh-pages branch

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    # Only the live site's repo. Copies of this code in other repos (e.g. V4 + Fable) have their own robot.
    if: github.repository == 'Realexis/cyprus-mushroom-finder'
    runs-on: ubuntu-latest
    timeout-minutes: 90          # a full 31-day fetch can take ~30 min
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore weather history
        uses: actions/cache/restore@v5.1.0
        with:
          path: data/processed/weather/history.npz
          key: weather-history-${{ github.run_id }}
          restore-keys: weather-history-

      - name: Download fixed data (habitat layer is encrypted)
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_KEY: ${{ secrets.STATIC_KEY }}
        run: |
          gh release download static-v1 --dir /tmp/static
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATIC_KEY \
            -in /tmp/static/static.tar.gz.enc | tar -xz
          mkdir -p web/public/tiles
          mv /tmp/static/*.pmtiles web/public/tiles/

      - name: Fetch weather, score 8 days, export public data
        working-directory: pipeline
        run: uv run python -m shroomy.daily --public ${{ inputs.full && '--full' || '' }}

      - name: Save weather history
        if: always()
        uses: actions/cache/save@v5.1.0
        with:
          path: data/processed/weather/history.npz
          key: weather-history-${{ github.run_id }}

      - name: Build and deploy the site
        env:
          DEPLOY_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (cd web && npm ci)
          ./scripts/deploy-pages.sh
