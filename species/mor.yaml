# Morels (Morchella esculenta / elata).
# EVERY NUMBER HERE IS A STARTING GUESS FROM RESEARCH, to calibrate with dated records and the
# 2025-26 backtest (step 9). [SPEC] = v0.3 spec (docs/methodology-v0.3.md), [BRIEF] = original brief,
# [GROUP] = same as the other species of its group (no species-specific source yet), [GUESS] = ours.
code: mor
english_name: morels
latin_name: Morchella esculenta / elata
local_name: {name: arnaoui, confirmed: false}           # [SPEC] to confirm
group: burn                                             # [SPEC]
tier: key
rare: false
confidence: low                                         # [SPEC]
# Two kinds of morel ground (audit step 8):
# 1. Recent burn: EFFIS burnt areas of the 2 years before, full weight from 50 % burnt [LAR16].
#    Burned forest has little tree cover left, so that part has no tree-cover minimum.
# 2. Unburned: many Cyprus morels are NOT fire morels - with Calabrian pine, strawberry tree, Cistus,
#    olive, at 500-600 m [LOI16, LOI16m]. Calabrian pine and the Troodos broadleaf zone at a low
#    weight 0.3 [GUESS, direction LOI16]. Strawberry tree, Cistus, olive: no map layer yet.
host_trees: {calabrian_pine: 0.3, golden_oak: 0.3, other_broadleaf: 0.3}
# [GUESS, no source] A square burnt 3-5 years ago is neither a fresh burn nor unburned ground; it still
# counts as unburned host trees at 0.3 (round 2, fix 3; TODO-facts A12).
altitude_range: [300, 1950]                             # [BRIEF] mid-high; 300 m edge [GUESS]
trigger_mm: 15                                          # [GUESS]
wait_degree_days: {total: 72, base_c: 4}                # [GUESS] kept: the 18-20 day rule (LOI19) is for autumn woodland fungi, not spring species
soil_temp_window: {min: 4, best: [8, 14], max: 20}      # [SPEC] spring soil warming (~10 C); range [GUESS]
extra_cues: {needs_burn: true, one_spring_after_fire: true}   # both used: EFFIS fire years, 2 years back
window_length_days: 14                                  # [GUESS]
recovery_days: 30                                   # [GUESS] kept long: nothing found either way (audit step 3)
season_prior: {jan: 0.3, feb: 1.0, mar: 1.0, apr: 1.0, may: 0.3}   # [GBIF] Cyprus records Feb 2, Mar 13, Apr 24; [LOI16]. Jan and May edges [GUESS] (Real, 2026-11-13: one edge month each side for every species)
soil_pref: {ph: unknown, texture: unknown, weight: 1.0}
lookalikes: []                                          # to source (L5)
sources: ["v0.3 spec 3.3-3.6", "Original brief: trees, altitude, season"]
