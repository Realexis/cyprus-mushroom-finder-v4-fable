[project]
name = "shroomy"
version = "0.3.0"
description = "Cyprus Mushroom Finder data pipeline: habitat, weather and growing-conditions scores"
requires-python = ">=3.12,<3.14"
dependencies = [
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
