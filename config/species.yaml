# =====================================================================
# Target species (v1). Facts come from the project brief. Tags:
#   [BRIEF] = from the brief    [DRAFT] = our reading, listed in docs/TODO-facts.md
#   [S7]    = the user's answer to open question S7 (2026-11-12)
#
# A species filter changes ONLY two things [BRIEF]:
#   1. the habitat filter (which trees + which altitude bands count)
#   2. the season window (months). Outside the window the score is 0.
# Inside the window the season factor is 1; every other factor and weight
# stays the same as the general map (config/scoring.yaml).
#
# Tree codes (pipeline habitat layer):
#   1 Calabrian pine (likely)   2 Troodos black pine (likely)
#   3 Golden oak (likely)       4 Other broadleaf   (5 cedar = closed reserve)
# Altitude bands: 1 low, 2 mid, 3 high (>1,200 m)
#
# Words on the site: "good conditions for [species] habitat", never "find X here".
# =====================================================================

species:
  - code: lde
    latin: Lactarius deliciosus
    common: red pine mushroom                       # [BRIEF]
    local: kokkinomanitaro                          # [BRIEF] (the one local name not to confirm)
    local_confirmed: true
    trees: [1, 2, 3]                                # [BRIEF] pine; also golden oak, kermes oak
    trees_text: "Pine (Calabrian and black pine); also golden oak and kermes oak"
    bands: [1, 2, 3]                                # [BRIEF] "all pine"
    altitude_text: "All pine altitudes"
    months: [10, 11, 12, 1, 2]                      # [LOI16] Oct-Feb (was [BRIEF] Oct-Jan)
    notes:
      - "Kermes oak is not on our tree map yet, so those areas are not counted."   # [DRAFT] D8
    inat: ["Lactarius deliciosus"]

  - code: lsa
    latin: Lactarius sanguifluus
    common: bloody milk cap                         # [BRIEF]
    local: gematas                                  # [BRIEF] to confirm
    local_confirmed: false
    trees: [2]                                      # [BRIEF] black pine
    trees_text: "Troodos black pine"
    bands: [3]                                      # [BRIEF] >1,200 m
    altitude_text: "Above 1,200 m"
    months: [9, 10, 11]                             # [WIK-LS] Sep-Nov (was [BRIEF] Sep-Oct)
    notes: []
    inat: ["Lactarius sanguifluus"]

  - code: rde
    latin: Russula delica
    common: milk-white brittlegill                  # [BRIEF]
    local: aspromanitaro                            # [BRIEF] to confirm
    local_confirmed: false
    # [BRIEF] "all forest". [S7] Other broadleaf (4) counts only for morels -> left out here.
    # Open question S9 in docs/TODO-facts.md.
    trees: [1, 2, 3]
    trees_text: "All forest (pine and golden oak on this map)"
    bands: [1, 2, 3]                                # [BRIEF] all
    altitude_text: "All altitudes"
    months: [9, 10]                                 # [BRIEF] Sep-Oct, warm spells
    notes:
      - "The brief says it fruits in warm spells. That rule is not in the score yet (TODO S5)."
    inat: ["Russula delica"]

  - code: tca
    latin: Tricholoma caligatum
    common: matsutake                               # [BRIEF]
    local: imero                                    # [BRIEF] to confirm
    local_confirmed: false
    trees: [1, 2, 3]                                # [BRIEF] pine, golden oak
    trees_text: "Pine and golden oak"
    bands: [2, 3]                                   # [BRIEF] mid-high
    altitude_text: "Mid and high altitudes"
    months: [11, 12, 1]                             # [BRIEF] Nov-Jan
    notes: []
    inat: ["Tricholoma caligatum"]

  - code: mor
    latin: Morchella esculenta / elata
    common: morels                                  # [BRIEF]
    local: arnaoui                                  # [BRIEF] to confirm
    local_confirmed: false
    # [BRIEF] deciduous trees, burned ground. Golden oak is evergreen, so only
    # "Other broadleaf" (4) counts. [S7] morels keep Other broadleaf.
    trees: [4]
    trees_text: "Deciduous broadleaf trees; burned ground"
    bands: [2, 3]                                   # [BRIEF] mid-high
    altitude_text: "Mid and high altitudes"
    months: [2, 3, 4]                               # [GBIF, LOI16] Feb-Apr (was [BRIEF] Mar-Apr)
    notes:
      - "Burned ground is not on the map yet (no data source chosen, TODO D5)."
      - "\"Other broadleaf\" mixes deciduous and evergreen trees. Our map cannot tell them apart."   # [DRAFT]
    inat: ["Morchella esculenta", "Morchella elata"]

  - code: slu
    latin: Suillus                                  # Real, 2026-11-13 (was Suillus luteus: no Cyprus records)
    common: slippery Jacks                          # [BRIEF] "slippery Jack", made plural for the genus
    local: lartias                                  # [BRIEF] to confirm
    local_confirmed: false
    trees: [1, 2]                                   # [BRIEF] pine
    trees_text: "Pine"
    bands: [1, 2, 3]                                # [BRIEF] pine belt
    altitude_text: "The pine belt"
    months: [10, 11, 12, 1, 2]                      # [INAT/GBIF] Oct-Feb (was [BRIEF] Oct-Jan)
    notes: []
    inat: ["Suillus collinitus", "Suillus luteus"]   # photos: the Cyprus species first

  # ===================================================================
  # v0.3 (step 6). Seasons, habitats and tiers from the v0.3 spec 3.5 [SPEC].
  # trees/bands are the v1 map fields (only used without species profiles).
  # The v0.3 map uses species/<code>.yaml. "more" = shown behind "Show more species".
  # ===================================================================
  - code: pfe
    latin: Pleurotus eryngii var. ferulae
    common: fennel king oyster                      # [SPEC]
    local: ""
    local_confirmed: false
    tier: key
    trees: []
    trees_text: "Fields with giant fennel (no fennel map yet: fields and grassland stand in)"
    bands: [1, 2, 3]
    altitude_text: "Not known"
    months: [10, 11, 12, 1, 2, 3, 4]                # [SPEC] autumn-spring
    notes:
      - "We have no map of giant fennel. Fields and grassland are used instead, at half weight."
    inat: ["Pleurotus eryngii ferulae"]

  - code: bae
    latin: Boletus aereus / edulis
    common: bronze bolete / cep                     # [SPEC]
    local: ""
    local_confirmed: false
    tier: more
    trees: [3]
    trees_text: "Golden oak and kermes oak"
    bands: [1, 2, 3]
    altitude_text: "Not known"
    months: [10, 11]                                # [SPEC] autumn, not every year
    notes:
      - "Kermes oak is not on our tree map yet, so those areas are not counted."
    inat: ["Boletus aereus", "Boletus edulis"]

  - code: xer
    latin: Xerocomus subtomentosus / chrysenteron group
    common: yellow and red cracked boletes          # [SPEC]
    local: ""
    local_confirmed: false
    tier: more
    trees: [3]
    trees_text: "Oaks"
    bands: [1, 2, 3]
    altitude_text: "Not known"
    months: [10, 11]                                # [SPEC] autumn
    notes: []
    inat: ["Xerocomus subtomentosus", "Xerocomellus chrysenteron"]

  - code: lnu
    latin: Lepista nuda
    common: wood blewit                             # [SPEC]
    local: ""
    local_confirmed: false
    tier: more
    trees: [1, 2, 3]                                # [S7] other broadleaf only for morels
    trees_text: "All forest (leaf litter)"
    bands: [1, 2, 3]
    altitude_text: "All altitudes"
    months: [11, 12, 1, 2]                          # [GBIF] Nov-Feb (was [SPEC] autumn-winter)
    notes: []
    inat: ["Lepista nuda", "Collybia nuda"]

  - code: cco
    latin: Coprinus comatus
    common: shaggy ink cap                          # [SPEC]
    local: ""
    local_confirmed: false
    tier: more
    trees: []
    trees_text: "Meadows and roadsides"
    bands: [1, 2, 3]
    altitude_text: "Not known"
    months: [11, 12, 1, 2, 3, 4]                    # [PIO08, records] Nov-Apr (was [SPEC] Dec-Feb)
    notes:
      - "Roadsides are not on our map, only meadows and grassland."
    inat: ["Coprinus comatus"]

  - code: aca
    latin: Agaricus campestris
    common: field mushroom                          # [SPEC]
    local: ""
    local_confirmed: false
    tier: more
    # User decision 2026-11-13: shown only behind "Show more species", with this warning.
    warn: "Easily confused with deadly white Amanitas, such as the death cap."
    trees: []
    trees_text: "Grassland"
    bands: [1, 2, 3]
    altitude_text: "Not known"
    months: [10, 11, 12, 1, 2, 3]                   # [PIO08] Oct-Mar (was [SPEC] winter-spring)
    notes: []
    inat: ["Agaricus campestris"]

  - code: cci
    latin: Cantharellus cibarius / subpruinosus
    common: chanterelle                             # [SPEC]
    local: ""
    local_confirmed: false
    tier: more
    rare: true                                      # [SPEC]
    trees: [1, 2]
    trees_text: "Pine"
    bands: [1, 2, 3]
    altitude_text: "Not known"
    months: [10, 11, 12, 1]                         # [SPEC] autumn-winter
    notes: []
    inat: ["Cantharellus cibarius", "Cantharellus subpruinosus"]

  - code: ter
    latin: Terfezia
    common: desert truffle                          # [SPEC]
    local: ""
    local_confirmed: false
    tier: more
    rare: true                                      # [SPEC]
    trees: []
    trees_text: "Rock-rose scrub, as a stand-in. Its real host plant (Helianthemum) is not mapped"   # [LOI16]
    bands: [1]
    altitude_text: "Lowland, up to about 300 m"       # [LOI16] finds at 80-180 m
    months: [2, 3]                                  # [LOI16] Feb-Mar (was [SPEC] spring)
    notes:
      - "Its crop depends on autumn rain (September to October) and on late March (Andrino et al. 2019, Spain). How much rain it needs in Cyprus is not known, so the map does not score it."
      - "Its host plant in Cyprus is Helianthemum, mostly H. stipulatum (Loizides 2016). That plant is not mapped, so the map uses rock-rose scrub instead."
    inat: ["Terfezia"]
