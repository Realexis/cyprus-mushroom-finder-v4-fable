# Weather fetching (Open-Meteo). Scoring thresholds live in scoring.yaml.
open_meteo:
  forecast_url: https://api.open-meteo.com/v1/forecast
  history_url: https://historical-forecast-api.open-meteo.com/v1/forecast
  model: ecmwf_ifs                # [BRIEF] ECMWF IFS 9 km. The only model here with soil moisture 0-7 cm.
  timezone: Asia/Nicosia          # days run midnight to midnight, Cyprus time
  daily: [precipitation_sum, temperature_2m_mean, temperature_2m_min, temperature_2m_max, relative_humidity_2m_mean]
  # Daily means are made from these. Soil moisture must stay first (soil climatology uses it).
  # soil_temperature_0_to_7cm: audit step 7 (TODO-facts P2), available for ecmwf_ifs [OM].
  # No extra calls: 7 variables still count as one call per 14 days.
  hourly: [soil_moisture_0_to_7cm, soil_temperature_0_to_7cm]
  past_days: 31                   # covers 30-day rain + the 7-20 day pulse
  forecast_days: 8                # today + 7 days
  locations_per_request: 50       # smaller replies = fewer timeouts from GitHub servers

# Call budget. Open-Meteo free tier (pricing page, checked 2026-11-12):
# 600/min, 5,000/hour, 10,000/day. A location counts as one call per
# 14 days of data and per 10 variables. We stay well under.
budget:
  per_minute: 400
  per_hour: 4500
  per_day: 8000

# Soil moisture "normal" (climatology) for the percentile.
soil_climatology:
  block_km: 9                     # one point per 9 km (= ECMWF grid size)
  forest_only: true               # only blocks with forest habitat
  # Autumn-winter seasons, same model (ecmwf_ifs). Each costs ~1,200 calls,
  # so add ONE more season per day at most (cached seasons cost nothing).
  # TODO: add [2024-10-01, 2025-01-31] and [2023-10-01, 2024-01-31] on later days.
  seasons:
    - [2025-10-01, 2026-01-31]
