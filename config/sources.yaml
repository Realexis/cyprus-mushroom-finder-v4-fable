# Every data source: where it comes from, its licence, and the exact credit line.
# The "About the data" page is built from this file.
# licence_status: verified | to_verify

dem:
  name: Copernicus DEM GLO-30
  url: https://copernicus-dem-30m.s3.amazonaws.com/
  tiles: [N34_00_E032_00, N34_00_E033_00, N34_00_E034_00, N35_00_E032_00, N35_00_E033_00, N35_00_E034_00]
  licence: Copernicus DEM licence (free, attribution required)
  licence_status: verified
  credit: "© DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved"
  note: Surface model — includes tree tops and buildings.

forest_type:
  name: Copernicus HRL Forest Type 2018 (10 m)
  url: https://image.discomap.eea.europa.eu/arcgis/rest/services/GioLandPublic/HRL_ForestType_2018/ImageServer
  classes: {0: non-forest, 1: broadleaved, 2: coniferous, 255: outside area}
  licence: Copernicus full, free and open data policy (Regulation (EU) 2021/696)
  licence_status: verified
  credit: "© European Union, Copernicus Land Monitoring Service 2018, European Environment Agency (EEA)"

nature_reserves:
  name: EEA Nationally designated areas (NatDA) v24 — Cyprus code CY04 "Nature reserve"
  url: https://bio.discomap.eea.europa.eu/arcgis/rest/services/ProtectedSites/NatDAv24_Dyna_WM/MapServer/4
  filter: "countryCode='CY' AND designationTypeCode='CY04'"
  licence: CC BY 4.0
  licence_status: verified
  credit: "Nationally designated areas (NatDA) v24 © European Environment Agency (EEA), CC BY 4.0"
  note: >
    Covers the 7 nature reserves of the Republic of Cyprus (Chionistra, Drys tis Lanias,
    Kryos Potamos, Livadhi tou Pasha, Madari, Pikromiloudhi, Tripylos-Mavroi Kremmoi).
    No reserve data for areas not under Republic control (TODO).

natura2000:
  name: Natura 2000 sites (EEA)
  url: https://bio.discomap.eea.europa.eu/arcgis/rest/services/ProtectedSites/Natura2000Sites/MapServer
  filter: "MS='CY'"
  licence: CC BY 4.0
  licence_status: to_verify   # EEA standard licence; record not yet read
  credit: "Natura 2000 © European Environment Agency (EEA)"

geology:
  name: Geology of Cyprus — Geologic Units (Geological Survey Department, via DLS INSPIRE)
  url: https://eservices.dls.moi.gov.cy/inspire/rest/services/INSPIRE/GE_Geology/MapServer
  licence: Licence being confirmed with the Department of Lands and Surveys
  licence_status: to_verify
  credit: "Geological Survey Department, Republic of Cyprus (via Department of Lands and Surveys INSPIRE services)"
  use: Used only inside the model to find the golden oak zone. The rock map itself is not published.
  contact: INSPIRE@dls.moi.gov.cy

# Later phases (already planned):
open_meteo:
  name: Open-Meteo Forecast API
  licence: CC BY 4.0 (non-commercial free tier)
  licence_status: verified
  credit: "Weather data by Open-Meteo.com (CC BY 4.0)"
openstreetmap:
  name: OpenStreetMap (Geofabrik Cyprus extract, Protomaps build)
  licence: ODbL 1.0
  licence_status: verified
  credit: "© OpenStreetMap contributors"
inaturalist:
  name: iNaturalist species photos
  url: https://api.inaturalist.org/v1/
  licence: Per photo. Only CC0, CC BY, CC BY-SA and CC BY-NC photos are used.
  licence_status: verified
  credit: "Species photos from iNaturalist (inaturalist.org). Each photo shows its author and licence."
  use: Photos on the species cards. Shown from iNaturalist's open-data store, not copied.
gbif:
  name: GBIF occurrence records (Cyprus)
  url: https://api.gbif.org/v1/
  licence: Counts and links only. Each dataset keeps its own licence (CC0, CC BY or CC BY-NC).
  licence_status: verified
  credit: "Record counts from GBIF.org (Global Biodiversity Information Facility) and iNaturalist."
  use: The "Public records in Cyprus" part of each species card. Never used for the score or the map.
tree_cover:
  name: Copernicus HRL Tree Cover Density 2018 (10 m)
  url: https://image.discomap.eea.europa.eu/arcgis/rest/services/GioLandPublic/HRL_TreeCoverDensity_2018/ImageServer
  licence: Copernicus full, free and open data policy
  licence_status: verified
  credit: "© European Union, Copernicus Land Monitoring Service 2018, European Environment Agency (EEA)"
  use: v0.3 habitat — minimum tree cover for tree-partner species.
grassland:
  name: Copernicus HRL Grassland 2018 (10 m)
  url: https://image.discomap.eea.europa.eu/arcgis/rest/services/GioLandPublic/HRL_Grassland_2018/ImageServer
  licence: Copernicus full, free and open data policy
  licence_status: verified
  credit: "© European Union, Copernicus Land Monitoring Service 2018, European Environment Agency (EEA)"
  use: v0.3 habitat — fields and grassland species.
corine:
  name: CORINE Land Cover 2018
  url: https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer
  licence: Copernicus full, free and open data policy
  licence_status: verified
  credit: "© European Union, Copernicus Land Monitoring Service 2018, European Environment Agency (EEA)"
  use: v0.3 habitat — fields, pasture, sclerophyllous scrub (rock-rose), burnt areas (around 2018).
effis:
  name: EFFIS burnt areas (European Forest Fire Information System), layer modis.ba.poly
  url: https://maps.effis.emergency.copernicus.eu/effis
  licence: Copernicus Emergency Management Service data, free use with attribution (WFS says fees none, no access constraints)
  licence_status: to_verify       # check the EFFIS data policy page before relying on it
  credit: "© European Union, EFFIS, Copernicus Emergency Management Service"
  use: v0.3 habitat (audit step 8) — burnt areas with fire dates, 2016-2026; recent burns for morels, burnt squares removed for tree partners.
soilgrids:
  name: SoilGrids 2.0 (ISRIC) — water retention, texture, pH, organic carbon
  url: https://maps.isric.org/
  licence: CC BY 4.0
  licence_status: verified
  credit: "SoilGrids 2.0, ISRIC — World Soil Information (CC BY 4.0)"
  use: v0.3 soil layer — water bucket size, drainage, pH. A machine-learning estimate with few Cyprus profiles.
